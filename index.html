<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Pierwsza strona testowa konta dchvizja na GitHub Pages.">
  <title>Działa! · dchvizja</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #0c1423; color: #eff5ff; }
    main { width: min(100%, 620px); padding: clamp(28px, 7vw, 64px); border: 1px solid #2b3c54; border-radius: 24px; background: #142137; }
    .status { display: inline-flex; align-items: center; gap: 10px; color: #86efac; font-size: 14px; }
    .status::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
    h1 { margin: 24px 0 16px; font-size: clamp(44px, 10vw, 72px); letter-spacing: -.05em; line-height: 1.05; }
    p { color: #bac9df; line-height: 1.7; }
    a { display: inline-block; margin-top: 16px; padding: 12px 18px; border-radius: 10px; background: #a5f3cc; color: #10231c; font-weight: 650; text-decoration: none; }
    a:hover { background: #d1fae5; }
    a:focus-visible { outline: 3px solid white; outline-offset: 5px; }
    footer { margin-top: 36px; font-size: 13px; color: #91a5c2; }
  </style>
</head>
<body>
  <main>
    <span class="status">GitHub Pages · online</span>
    <h1>Działa!</h1>
    <p>Mała strona, pierwszy krok. To test publikacji z repozytorium <strong>test_agentow</strong> na koncie <strong>dchvizja</strong>.</p>
    <a href="https://github.com/dchvizja/test_agentow">Zobacz repozytorium ↗</a>
    <footer>HTML + CSS · bez zależności · opublikowano z pomocą agenta</footer>
  </main>
</body>
</html>
